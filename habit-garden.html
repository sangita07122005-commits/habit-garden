<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Garden — Grow a little every day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12192b;
    --bg-alt: #1b2440;
    --card: #202a4a;
    --accent-gold: #e8a33d;
    --accent-coral: #f2785c;
    --leaf: #6fa287;
    --leaf-bright: #8fc9a3;
    --text: #f5f1e8;
    --text-dim: #a8b3c7;
    --border: rgba(245,241,232,0.08);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: radial-gradient(circle at 20% 0%, var(--bg-alt), var(--bg) 60%);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    padding: 48px 20px 80px;
  }

  .wrap{ max-width: 780px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 44px; }

  header .eyebrow{
    display:inline-block;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-gold);
    border: 1px solid rgba(232,163,61,0.35);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(34px, 6vw, 52px);
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  header p{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 440px;
    margin: 0 auto;
  }

  form{
    display:flex;
    gap: 10px;
    margin-bottom: 30px;
  }

  input[type="text"]{
    flex:1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 16px;
    border-radius: 12px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s ease;
  }
  input[type="text"]:focus{ border-color: var(--accent-gold); }
  input[type="text"]::placeholder{ color: var(--text-dim); }

  button.add{
    background: var(--accent-gold);
    color: #12192b;
    border: none;
    padding: 0 22px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  button.add:hover{ background: #f0b256; transform: translateY(-1px); }
  button.add:focus-visible{ outline: 2px solid var(--text); outline-offset: 2px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 18px 16px;
    position: relative;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    align-items:center;
    text-align:center;
  }

  .card .top-row{
    width:100%;
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    margin-bottom: 4px;
  }

  .streak{
    font-size: 11px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--accent-coral);
    font-weight: 600;
  }

  .remove{
    background:none;
    border:none;
    color: var(--text-dim);
    cursor:pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .remove:hover{ color: var(--accent-coral); }
  .remove:focus-visible{ outline: 2px solid var(--text); outline-offset: 2px; }

  .plant-stage{
    width: 92px;
    height: 92px;
    margin: 6px 0 10px;
  }

  .plant-stage svg{ width:100%; height:100%; overflow: visible; }

  .stem{
    stroke: var(--leaf);
    stroke-width: 4;
    stroke-linecap: round;
    fill: none;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    transition: stroke-dashoffset .6s ease;
  }

  .leaf{
    fill: var(--leaf);
    opacity: 0;
    transform-origin: center;
    transition: opacity .5s ease, transform .5s ease;
    transform: scale(0.3);
  }

  .bud{
    fill: var(--accent-coral);
    opacity: 0;
    transition: opacity .5s ease .1s, transform .5s ease .1s;
    transform: scale(0.2);
    transform-origin: center;
  }

  .habit-name{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  .checkbtn{
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor:pointer;
    transition: all .2s ease;
  }
  .checkbtn:hover{ border-color: var(--leaf); color: var(--text); }
  .checkbtn:focus-visible{ outline: 2px solid var(--text); outline-offset: 2px; }

  .checkbtn.done{
    background: rgba(111,162,135,0.15);
    border-color: var(--leaf-bright);
    color: var(--leaf-bright);
  }

  .empty{
    text-align:center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 40px 0;
    grid-column: 1 / -1;
  }

  .sparkle{
    position:absolute;
    pointer-events:none;
    font-size: 18px;
    opacity: 0;
  }

  @keyframes pop{
    0%{ opacity:0; transform: translateY(0) scale(.6); }
    30%{ opacity:1; }
    100%{ opacity:0; transform: translateY(-38px) scale(1.1); }
  }

  .sparkle.fire{ animation: pop .9s ease forwards; }

  @media (prefers-reduced-motion: reduce){
    .stem, .leaf, .bud, .sparkle.fire{ transition: none !important; animation: none !important; }
  }

  footer{
    text-align:center;
    margin-top: 50px;
    color: var(--text-dim);
    font-size: 12.5px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Day by day</span>
    <h1>Habit Garden</h1>
    <p>Every habit is a plant. Show up for it, and watch it grow — miss a day, and it waits patiently for you to come back.</p>
  </header>

  <form id="habit-form">
    <input type="text" id="habit-input" placeholder="Add a habit — e.g. 30 min DSA practice" maxlength="40" required>
    <button type="submit" class="add">Plant it</button>
  </form>

  <div class="grid" id="grid"></div>

  <footer>Your progress is saved automatically on this device.</footer>
</div>

<script>
  const STORAGE_KEY = 'habit-garden-data';
  const grid = document.getElementById('grid');
  const form = document.getElementById('habit-form');
  const input = document.getElementById('habit-input');

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function daysBetween(a, b){
    const d1 = new Date(a), d2 = new Date(b);
    return Math.round((d2 - d1) / (1000*60*60*24));
  }

  function loadHabits(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function saveHabits(habits){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
  }

  let habits = loadHabits();

  function addHabit(name){
    habits.push({
      id: Date.now().toString(36),
      name,
      streak: 0,
      lastDone: null
    });
    saveHabits(habits);
    render();
  }

  function removeHabit(id){
    habits = habits.filter(h => h.id !== id);
    saveHabits(habits);
    render();
  }

  function toggleDone(id, cardEl){
    const h = habits.find(x => x.id === id);
    if(!h) return;
    const today = todayStr();

    if(h.lastDone === today){
      // undo today's check
      h.streak = Math.max(0, h.streak - 1);
      h.lastDone = null;
    } else {
      if(h.lastDone && daysBetween(h.lastDone, today) === 1){
        h.streak += 1;
      } else {
        h.streak = 1;
      }
      h.lastDone = today;
      spawnSparkle(cardEl);
    }
    saveHabits(habits);
    render();
  }

  function spawnSparkle(cardEl){
    const s = document.createElement('div');
    s.className = 'sparkle fire';
    s.textContent = '✦';
    s.style.left = '50%';
    s.style.top = '30%';
    s.style.color = 'var(--accent-gold)';
    cardEl.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }

  function stageFromStreak(streak){
    if(streak <= 0) return 0;
    if(streak === 1) return 1;
    if(streak <= 3) return 2;
    if(streak <= 6) return 3;
    return 4;
  }

  function plantSVG(stage){
    // stage 0: seed, 1: sprout, 2: stem+1 leaf, 3: stem+2 leaves, 4: stem+leaves+bloom
    return `
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="88" rx="30" ry="6" fill="rgba(0,0,0,0.25)"/>
      <path class="stem" d="M50 85 L50 ${stage >= 1 ? 40 : 78}" style="stroke-dashoffset:${stage >= 1 ? 0 : 60}"/>
      <path class="leaf" style="opacity:${stage>=2?1:0}; transform:scale(${stage>=2?1:0.3})" d="M50 60 C 30 55, 25 40, 40 38 C 45 48, 50 55, 50 60 Z"/>
      <path class="leaf" style="opacity:${stage>=3?1:0}; transform:scale(${stage>=3?1:0.3})" d="M50 50 C 70 45, 75 30, 60 28 C 55 38, 50 45, 50 50 Z"/>
      <circle class="bud" style="opacity:${stage>=4?1:0}; transform:scale(${stage>=4?1:0.2})" cx="50" cy="38" r="9"/>
      <circle class="bud" style="opacity:${stage>=4?1:0}; transform:scale(${stage>=4?1:0.2}); fill:var(--accent-gold)" cx="50" cy="38" r="4"/>
      ${stage === 0 ? '<ellipse cx="50" cy="82" rx="6" ry="4" fill="var(--leaf)" opacity="0.8"/>' : ''}
    </svg>`;
  }

  function render(){
    grid.innerHTML = '';
    if(habits.length === 0){
      grid.innerHTML = '<div class="empty">No habits planted yet — add your first one above 🌱</div>';
      return;
    }

    const today = todayStr();

    habits.forEach(h => {
      const stage = stageFromStreak(h.streak);
      const doneToday = h.lastDone === today;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="top-row">
          <span class="streak">${h.streak > 0 ? h.streak + ' day streak' : 'no streak yet'}</span>
          <button class="remove" aria-label="Remove habit" title="Remove">✕</button>
        </div>
        <div class="plant-stage">${plantSVG(stage)}</div>
        <div class="habit-name">${h.name}</div>
        <button class="checkbtn ${doneToday ? 'done' : ''}">${doneToday ? '✓ Done today' : 'Mark today done'}</button>
      `;

      card.querySelector('.remove').addEventListener('click', () => removeHabit(h.id));
      card.querySelector('.checkbtn').addEventListener('click', () => toggleDone(h.id, card));

      grid.appendChild(card);
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if(!val) return;
    addHabit(val);
    input.value = '';
  });

  render();
</script>

</body>
</html>
